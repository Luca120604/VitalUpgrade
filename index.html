<!DOCTYPE html>
<html lang="de" style="--accent: oklch(0.78 0.09 190); --accent-ink: oklch(0.22 0.04 190); --accent-dim: oklch(0.35 0.06 190 / 0.22);">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>VITAL</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body { margin: 0; background: #0a0a0c; min-height: 100vh; min-height: 100dvh; }
    body {
      display: flex; align-items: center; justify-content: center;
      padding: 20px; box-sizing: border-box;
    }
    #root { position: relative; }

    /* Desktop / wide-screen: show as iPhone mockup */
    .device {
      width: 390px; height: 844px;
      background: var(--bg-0); color: var(--text-0);
      border-radius: 48px; overflow: hidden; position: relative;
      box-shadow: 0 0 0 10px #1d1d20, 0 0 0 11px #26262a,
                  0 40px 90px rgba(0,0,0,0.6), 0 10px 30px rgba(0,0,0,0.4);
    }
    .device::after {
      content: ''; position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      width: 120px; height: 34px; border-radius: 20px; background: #000; z-index: 1000; pointer-events: none;
    }
    .status-bar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 999;
      height: 46px; display: flex; align-items: center; justify-content: space-between;
      padding: 18px 28px 0; pointer-events: none;
      font-family: -apple-system, system-ui; font-size: 15px; font-weight: 600; color: var(--text-0);
    }

    /* Mobile / narrow: full-screen app, no fake iPhone chrome */
    @media (max-width: 500px) {
      body { padding: 0; }
      #root { width: 100%; height: 100dvh; }
      .device {
        width: 100vw; height: 100dvh;
        border-radius: 0; box-shadow: none;
      }
      .device::after { display: none; }
      .status-bar { display: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <!-- Base layers -->
  <script type="text/babel" src="icons.jsx" data-plugins="transform-react-jsx-source" data-filename="icons.jsx"></script>
  <script type="text/babel" src="icons-extra.jsx" data-plugins="transform-react-jsx-source" data-filename="icons-extra.jsx"></script>
  <script type="text/babel" src="lib/storage.jsx" data-plugins="transform-react-jsx-source" data-filename="lib/storage.jsx"></script>
  <script type="text/babel" src="lib/storage-compat.jsx" data-plugins="transform-react-jsx-source" data-filename="lib/storage-compat.jsx"></script>
  <script type="text/babel" src="lib/parsing.jsx" data-plugins="transform-react-jsx-source" data-filename="lib/parsing.jsx"></script>
  <script type="text/babel" src="data.jsx" data-plugins="transform-react-jsx-source" data-filename="data.jsx"></script>
  <script type="text/babel" src="data-extra.jsx" data-plugins="transform-react-jsx-source" data-filename="data-extra.jsx"></script>
  <script type="text/babel" src="lib/rules.jsx" data-plugins="transform-react-jsx-source" data-filename="lib/rules.jsx"></script>
  <script type="text/babel" src="ui.jsx" data-plugins="transform-react-jsx-source" data-filename="ui.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx" data-plugins="transform-react-jsx-source" data-filename="tweaks-panel.jsx"></script>

  <!-- Screens -->
  <script type="text/babel" src="screens/home.jsx" data-plugins="transform-react-jsx-source" data-filename="screens/home.jsx"></script>
  <script type="text/babel" src="screens/werte.jsx" data-plugins="transform-react-jsx-source" data-filename="screens/werte.jsx"></script>
  <script type="text/babel" src="screens/wissen.jsx" data-plugins="transform-react-jsx-source" data-filename="screens/wissen.jsx"></script>
  <script type="text/babel" src="screens/einstellungen.jsx" data-plugins="transform-react-jsx-source" data-filename="screens/einstellungen.jsx"></script>
  <script type="text/babel" src="screens/sheets.jsx" data-plugins="transform-react-jsx-source" data-filename="screens/sheets.jsx"></script>
  <script type="text/babel" src="screens/quiz.jsx" data-plugins="transform-react-jsx-source" data-filename="screens/quiz.jsx"></script>
  <script type="text/babel" src="screens/action-onboarding.jsx" data-plugins="transform-react-jsx-source" data-filename="screens/action-onboarding.jsx"></script>
  <script type="text/babel" src="screens/journal.jsx" data-plugins="transform-react-jsx-source" data-filename="screens/journal.jsx"></script>
  <script type="text/babel" src="fab-coach.jsx" data-plugins="transform-react-jsx-source" data-filename="fab-coach.jsx"></script>

  <!-- App -->
  <script type="text/babel" src="app.jsx" data-plugins="transform-react-jsx-source" data-filename="app.jsx"></script>

  <script type="text/babel" data-plugins="transform-react-jsx-source" data-filename="inline-shell">
    function Shell() {
      return (
        <div className="device">
          <div className="status-bar">
            <span>9:41</span>
            <span style={{ display: 'inline-flex', gap: 5, alignItems: 'center' }}>
              <svg width="17" height="11" viewBox="0 0 17 11"><rect x="0" y="6.5" width="3" height="4" rx="0.7" fill="currentColor"/><rect x="4.5" y="4.5" width="3" height="6" rx="0.7" fill="currentColor"/><rect x="9" y="2.5" width="3" height="8" rx="0.7" fill="currentColor"/><rect x="13.5" y="0" width="3" height="10.5" rx="0.7" fill="currentColor"/></svg>
              <svg width="22" height="11" viewBox="0 0 22 11"><rect x="0.5" y="0.5" width="19" height="10" rx="2.5" stroke="currentColor" strokeOpacity="0.45" fill="none"/><rect x="2" y="2" width="16" height="7" rx="1.2" fill="currentColor"/></svg>
            </span>
          </div>
          <window.App />
        </div>
      );
    }
    function waitForDeps(cb, attempts = 0) {
      if (window.App && window.Home && window.Werte && window.Wissen && window.Einstellungen
          && window.Onboarding && window.ActionSheet && window.QuickEntrySheet
          && window.FabCoach
          && window.Storage && window.Rules && window.Parsing && window.UI && window.Icon) {
        cb();
      } else if (attempts < 120) {
        setTimeout(() => waitForDeps(cb, attempts + 1), 40);
      } else {
        console.error('[vital] deps missing', { App: !!window.App, Home: !!window.Home, UI: !!window.UI });
      }
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    waitForDeps(() => root.render(<Shell />));
  </script>
</body>
</html>
